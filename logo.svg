<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 34" width="130" height="34">
  <defs>
    <linearGradient id="eq" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="txt" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <!-- Icon: dark rounded square + equalizer bars (matches favicon) -->
  <rect x="0" y="1" width="32" height="32" rx="9" fill="#140d24"/>
  <rect x="7"  y="18" width="3.4" height="9"  rx="1.7" fill="url(#eq)"/>
  <rect x="12" y="12" width="3.4" height="15" rx="1.7" fill="url(#eq)"/>
  <rect x="17" y="15" width="3.4" height="12" rx="1.7" fill="url(#eq)"/>
  <rect x="22" y="8"  width="3.4" height="19" rx="1.7" fill="url(#eq)"/>

  <!-- Wordmark -->
  <text
    x="40" y="23.5"
    font-family="'Syne','Inter',system-ui,sans-serif"
    font-weight="800"
    font-size="17"
    letter-spacing="-0.6"
    fill="#ffffff">Concert</text>
  <text
    x="110" y="23.5"
    font-family="'Syne','Inter',system-ui,sans-serif"
    font-weight="800"
    font-size="17"
    letter-spacing="-0.6"
    fill="url(#txt)">ID</text>
</svg>
